[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slack-huddle-mcp"
version = "0.2.0"
description = "MCP server that exposes Slack AI-generated huddle transcripts to LLM agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Prithvi" }]
keywords = ["mcp", "slack", "huddle", "transcript", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=0.2.0",
    "httpx>=0.27.0",
    "keyring>=24.0.0",
    "click>=8.1.0",
    "anyio>=4.0.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-requests",
]

[project.scripts]
slack-huddle-mcp = "slack_huddle.cli:cli"

[project.urls]
Homepage = "https://github.com/prithvi-bharadwaj/slack-huddle-mcp"
Repository = "https://github.com/prithvi-bharadwaj/slack-huddle-mcp"
Issues = "https://github.com/prithvi-bharadwaj/slack-huddle-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_huddle"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keyring.*", "fastmcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: integration tests requiring live Slack tokens (gated by INTEGRATION=1)",
]

[tool.coverage.run]
source = ["src/slack_huddle"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
